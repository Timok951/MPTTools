<div class="form-field {% if field.errors %}has-error{% endif %} {% if full_width %}full{% endif %} {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
    {% if field.field.widget.input_type == "checkbox" %}
        <label for="{{ field.id_for_label }}" class="checkbox-control">
            {{ field }}
            <span>{{ field.label }}</span>
        </label>
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {% if add_url and show_add_button %}
        <div class="inline-field-with-action">
            {{ field }}
            <a
                class="quick-add-btn"
                href="{{ add_url }}"
                data-add-url="{{ add_url }}"
                title="{{ add_title|default:'Добавить' }}"
                aria-label="{{ add_title|default:'Добавить' }}"
                onclick="(function(el){const u=new URL(el.dataset.addUrl, window.location.origin);u.searchParams.set('next', window.location.pathname + window.location.search);window.location.href=u.pathname + u.search + u.hash;return false;})(this);"
            >+</a>
        </div>
        {% else %}
        {{ field }}
        {% endif %}
    {% endif %}
    {% if field.help_text %}
        <div class="field-help">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}
        <div class="field-error">{{ error }}</div>
    {% endfor %}
</div>
