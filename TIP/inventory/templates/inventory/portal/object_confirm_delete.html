{% extends "inventory/base.html" %}
{% load i18n %}

{% block content %}
{% include "inventory/portal/_portal_bar.html" %}
<div class="card">
    <h2>Удаление: {{ cfg.title }}</h2>
    <p>Подтвердите удаление: <strong>{{ object }}</strong>.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="btn" type="submit">Удалить</button>
            <a class="secondary" href="{{ portal_back_url }}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
